[project]
name = "demoqatestselenium"
version = "0.1.0"
description = ""
authors = [{ name = "turgor", email = "maxac153@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4,<3.0.0",
    "faker>=40.15.0,<41.0.0",
    "selenium==4.10.0",
    "webdriver-manager==3.8.6",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "beautifulsoup4==4.12.2",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "blinker (==1.7.0)",
    "setuptools (>=82.0.1,<83.0.0)",
    "browsermob-proxy (>=0.8.0,<0.9.0)",
]

[tool.poetry.scripts]
test = "pytest tests/ --alluredir=input"
allure-report = "allure serve input"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.2"
pytest-html = "^3.2.0"
pytest-metadata = "^3.0.0"
allure-pytest = ">=2.16.0,<3.0.0"
allure-python-commons = ">=2.16.0,<3.0.0"

[build-system]
requires = ["poetry-core>=1.8.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"