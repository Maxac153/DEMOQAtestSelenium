[pytest]
# Нужна для кириллицы в id параметризованных тестов, оставляем
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

# --strict-markers: опечатка в маркере станет ошибкой сборки, а не тихим пропуском
# -s убран: при xdist выводит кашу, а при нужде включается вручную (pytest -s)
addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=output/allure-results
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=output/playwright

# Только существующие папки (по приложенным тестам это src/ui/..., src/api/...)
testpaths = src

python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: Быстрые критические тесты (Smoke testing)
    regression: Полные регрессионные тесты (Regression testing)
    api: Тесты для проверки API (интеграционные / компонентные)
    ui: Тесты для проверки пользовательского интерфейса (Web UI)
    e2e: Сквозные тесты (End-to-End)
    db: Тесты, проверяющие напрямую базу данных
    positive: Позитивные сценарии
    negative: Негативные сценарии
    account: Тесты Account API
    book_store: Тесты Book Store API